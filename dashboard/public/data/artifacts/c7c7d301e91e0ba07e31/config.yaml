run:
  name: best_tabular_transductive_graphhop_adult_R1-seed2
  seed: 2
  output_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/outputs/R1/transductive/graphhop/tabular/adult/best_tabular_transductive_graphhop_adult_R1-sweep-20260401T105242Z
  log_level: detailed
  fail_fast: true
limits:
  profile: auto
dataset:
  id: adult
  download: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/datasets
  options: {}
sampling:
  seed: 2
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 1
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 2
  fit_on: train_labeled
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/preprocess
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: tabular.one_hot
    - id: core.ensure_2d
    - id: tabular.impute
    - id: tabular.standard_scaler
    - id: core.pca
      params:
        n_components: 30
    - id: core.to_numpy
method:
  kind: transductive
  id: graphhop
  device:
    device: auto
    dtype: float32
    resolved_device: cuda
  params:
    hops: 2
    max_iter: 50
    lr: 0.01
    weight_decay: 0.0005
    max_epochs: 200
    patience: 50
    min_delta: 0.01
    temperature: 0.1
    alpha: 1.0
    beta: 1.0
    symmetrize: true
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
graph:
  enabled: true
  seed: 2
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/graph
  spec:
    scheme: knn
    metric: cosine
    k: 15
    symmetrize: mutual
    weights:
      kind: heat
      sigma: 1.0
    normalize: rw
    self_loops: true
    backend: numpy
    chunk_size: 1024
    feature_field: features.X
