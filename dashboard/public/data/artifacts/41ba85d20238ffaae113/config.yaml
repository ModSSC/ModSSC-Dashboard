run:
  name: best_audio_inductive_s4vm_yesno_R3-seed5
  seed: 5
  output_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/outputs/R3/inductive/s4vm/audio/yesno/best_audio_inductive_s4vm_yesno_R3-sweep-20260329T013505Z
  fail_fast: true
  log_level: detailed
limits:
  profile: auto
dataset:
  id: yesno
  download: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/datasets
  options:
    class_filter:
    - 'yes'
    - 'no'
sampling:
  seed: 5
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 5
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 5
  fit_on: train_labeled
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/preprocess
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: labels.to_torch
      params:
        device: auto
        dtype: int64
    - id: audio.load_waveform
      params:
        allow_fallback: true
        target_sample_rate: 16000
        max_length: 16000
    - id: core.to_torch
      params:
        device: auto
        dtype: float32
method:
  kind: inductive
  id: s4vm
  device:
    device: auto
    dtype: float32
    resolved_device: cuda
  params:
    classifier_id: audio_pretrained
    classifier_backend: torch
    classifier_params:
      bundle: WAV2VEC2_BASE
      freeze_backbone: false
      lr: 0.0001
      weight_decay: 0.0001
      batch_size: 8
      max_epochs: 5
    k_candidates: 6
    flip_rate: 0.05
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
