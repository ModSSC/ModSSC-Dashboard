run:
  name: best_tabular_transductive_chebnet_iris_R4-seed3
  seed: 3
  output_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/outputs/R4/transductive/chebnet/tabular/iris/best_tabular_transductive_chebnet_iris_R4-sweep-20260406T171022Z
  log_level: detailed
  fail_fast: true
limits:
  profile: auto
dataset:
  id: iris
  download: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/datasets
  options: {}
sampling:
  seed: 3
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 10
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 3
  fit_on: train_labeled
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/preprocess
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: core.ensure_2d
    - id: tabular.impute
    - id: tabular.standard_scaler
    - id: core.pca
      params:
        n_components: 30
    - id: core.to_numpy
method:
  kind: transductive
  id: chebnet
  device:
    device: auto
    dtype: float32
    resolved_device: cuda
  params:
    hidden_dim: 32
    k: 2
    dropout: 0.5
    lr: 0.01
    weight_decay: 0.0005
    max_epochs: 200
    patience: 50
    add_self_loops: true
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
graph:
  enabled: true
  seed: 3
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/graph
  spec:
    scheme: knn
    metric: cosine
    k: 15
    symmetrize: mutual
    weights:
      kind: heat
      sigma: 1.0
    normalize: rw
    self_loops: true
    backend: numpy
    chunk_size: 1024
    feature_field: features.X
