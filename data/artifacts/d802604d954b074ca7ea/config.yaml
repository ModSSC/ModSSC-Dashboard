run:
  name: best_graph_inductive_mean_teacher_citeseer_R1-seed7
  seed: 7
  output_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/outputs/R1/inductive/mean_teacher/graph/citeseer/best_graph_inductive_mean_teacher_citeseer_R1-sweep-20260406T170019Z
  fail_fast: true
  log_level: detailed
limits:
  profile: auto
dataset:
  id: citeseer
  download: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/datasets
  options: {}
sampling:
  seed: 7
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 1
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 7
  fit_on: train_labeled
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/preprocess
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: labels.to_torch
      params:
        device: auto
        dtype: int64
    - id: graph.sparse_adjacency
      params:
        max_nodes: 20000
        batch_size: 64
        embed_epochs: 5
        embed_lr: 0.01
        undirected: true
        device: auto
    - id: core.to_torch
      params:
        device: auto
        dtype: float32
augmentation:
  enabled: true
  seed: 7
  mode: fixed
  modality: graph
  weak:
    steps:
    - id: graph.feature_mask
      params:
        p: 0.05
  strong:
    steps:
    - id: graph.feature_mask
      params:
        p: 0.1
    - id: graph.edge_dropout
      params:
        p: 0.2
method:
  kind: inductive
  id: mean_teacher
  device:
    device: auto
    dtype: float32
    resolved_device: cuda
  params:
    lambda_u: 1.0
    unsup_warm_up: 0.4
    batch_size: 128
    max_epochs: 50
    ema_decay: 0.999
    freeze_bn: true
    detach_target: true
  model:
    classifier_id: graphsage_inductive
    classifier_backend: torch
    classifier_params:
      hidden_sizes:
      - 128
      activation: relu
      dropout: 0.1
      lr: 0.001
      weight_decay: 0.0
      batch_size: 256
      max_epochs: 50
    ema: true
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
