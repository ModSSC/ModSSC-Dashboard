run:
  name: multiclass_text_transductive_laplace_learning_ag_news_R2-seed1
  seed: 1
  output_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/outputs/multiclass_transductive/text/ag_news/laplace_learning/R2/multiclass_text_transductive_laplace_learning_ag_news_R2-sweep-20260509T023326Z
  log_level: detailed
  fail_fast: true
limits:
  profile: auto
dataset:
  id: ag_news
  download: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/datasets
  options:
    text_column: text
    label_column: label
    prefer_test_split: true
sampling:
  seed: 1
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 3
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 1
  fit_on: train
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/preprocess
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: text.ensure_strings
    - id: text.sentence_transformer
      params:
        batch_size: 32
        model_id: st:all-MiniLM-L6-v2
    - id: core.pca
      params:
        n_components: 128
    - id: core.to_numpy
method:
  kind: transductive
  id: laplace_learning
  device:
    device: auto
    dtype: float32
    resolved_device: cuda
  params: {}
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
  - balanced_accuracy
graph:
  enabled: true
  seed: 1
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/graph
  spec:
    scheme: knn
    metric: cosine
    k: 10
    symmetrize: or
    weights:
      kind: heat
      sigma: 1.0
    normalize: rw
    self_loops: true
    backend: sklearn
    chunk_size: 1024
    feature_field: features.X
