run:
  name: best_graph_inductive_daso_cora_R3-seed8
  seed: 8
  output_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/outputs/R3/inductive/daso/graph/cora/best_graph_inductive_daso_cora_R3-sweep-20260329T030446Z
  fail_fast: true
  log_level: detailed
limits:
  profile: auto
dataset:
  id: cora
  download: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/datasets
  options: {}
sampling:
  seed: 8
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 5
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 8
  fit_on: train_labeled
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/preprocess
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: labels.to_torch
      params:
        device: auto
        dtype: int64
    - id: graph.sparse_adjacency
      params:
        max_nodes: 20000
        batch_size: 32
        embed_epochs: 5
        embed_lr: 0.01
        undirected: true
        device: auto
    - id: core.to_torch
      params:
        device: auto
        dtype: float32
augmentation:
  enabled: true
  seed: 8
  mode: fixed
  modality: graph
  weak:
    steps:
    - id: graph.feature_mask
      params:
        p: 0.05
  strong:
    steps:
    - id: graph.feature_mask
      params:
        p: 0.1
    - id: graph.edge_dropout
      params:
        p: 0.2
method:
  kind: inductive
  id: daso
  device:
    device: auto
    dtype: float32
    resolved_device: cuda
  params:
    lambda_u: 1.0
    lambda_align: 1.0
    p_cutoff: 0.95
    t_proto: 0.05
    t_dist: 1.5
    queue_size: 256
    pretrain_steps: 5000
    dist_update_period: 100
    ema_decay: 0.999
    use_ema: true
    dist_aware: true
    interp_alpha: 0.5
    hard_label: true
    use_cat: false
    batch_size: 128
    max_epochs: 50
    detach_target: true
  model:
    classifier_id: graphsage_inductive
    classifier_backend: torch
    classifier_params:
      hidden_sizes:
      - 128
      activation: relu
      dropout: 0.1
      lr: 0.001
      weight_decay: 0.0
      batch_size: 128
      max_epochs: 50
    ema: false
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
