run:
  name: best_graph_inductive_setred_citeseer_R1-seed8
  seed: 8
  output_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/outputs/R1/inductive/setred/graph/citeseer/best_graph_inductive_setred_citeseer_R1-sweep-20260329T215334Z
  fail_fast: true
  log_level: detailed
limits:
  profile: auto
dataset:
  id: citeseer
  download: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/datasets
  options: {}
sampling:
  seed: 8
  plan:
    split:
      kind: holdout
      test_fraction: 0.2
      val_fraction: 0.1
      stratify: true
      shuffle: true
    labeling:
      mode: per_class
      value: 1
      strategy: balanced
      min_per_class: 1
      per_class: true
      fixed_indices: null
    imbalance:
      kind: none
    policy:
      respect_official_test: true
      use_official_graph_masks: true
      allow_override_official: false
preprocess:
  seed: 8
  fit_on: train_labeled
  cache: true
  cache_dir: /lustre/fsn1/projects/rech/dqp/uqj57xk/projet_modssc/modssc_cache/preprocess
  plan:
    output_key: features.X
    steps:
    - id: labels.encode
    - id: labels.to_torch
      params:
        device: auto
        dtype: int64
    - id: graph.sparse_adjacency
      params:
        max_nodes: 20000
        batch_size: 64
        embed_epochs: 5
        embed_lr: 0.01
        undirected: true
        device: auto
    - id: core.to_torch
      params:
        device: auto
        dtype: float32
method:
  kind: inductive
  id: setred
  device:
    device: auto
    dtype: float32
    resolved_device: cuda
  params:
    classifier_id: graphsage_inductive
    classifier_backend: torch
    classifier_params:
      hidden_sizes:
      - 128
      activation: relu
      dropout: 0.1
      lr: 0.001
      weight_decay: 0.0
      batch_size: 256
      max_epochs: 50
    max_iter: 10
    confidence_threshold: 0.95
    pool_size: 200
    max_new_labels: 50
    min_new_labels: 1
    theta: 0.05
    graph_type: knn
    knn_k: 10
    edge_weight: uniform
evaluation:
  split_for_model_selection: val
  report_splits:
  - val
  - test
  metrics:
  - accuracy
  - macro_f1
